<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crumb</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home screen app: icon, name, and colors (iPhone + Android) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Crumb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      // Light / Midnight (Nov 11, 2026): set before Crumb draws, so there's no white flash.
      try {
        var s = JSON.parse(localStorage.getItem('crumb_app_settings') || '{}');
        if (s && s.theme === 'midnight') {
          document.documentElement.setAttribute('data-theme', 'midnight');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#06101c');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
